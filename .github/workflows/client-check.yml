name: Client syntax check
on:
  push:
    paths:
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/client-check.yml'
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-client.mjs
      - run: node scripts/test-client-config.mjs
      - run: node scripts/test-combat-logic.mjs
